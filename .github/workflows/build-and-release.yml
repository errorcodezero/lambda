name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 14 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"

      - name: Install GCC (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install gcc
          HOMEBREW_PREFIX=$(brew --prefix)
          for f in "$HOMEBREW_PREFIX"/bin/gcc-*; do
            if [ -x "$f" ]; then
              echo "CC=$f" >> "$GITHUB_ENV"
              echo "Using GCC: $f"
              break
            fi
          done

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make release

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: make release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-${{ runner.os }}
          path: build/lambda*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir release-assets
          for dir in artifacts/*/; do
            platform=$(basename "$dir" | sed 's/lambda-//')
            for file in "$dir"/*; do
              filename=$(basename "$file")
              if [[ "$filename" == *.* ]]; then
                ext="${filename##*.}"
                base="${filename%.*}"
                cp "$file" "release-assets/${base}-${platform}.${ext}"
              else
                cp "$file" "release-assets/${filename}-${platform}"
              fi
            done
          done
          ls -la release-assets/

      - name: Determine release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
